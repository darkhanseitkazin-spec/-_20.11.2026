<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учёт расходов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <p class="eyebrow">Личные финансы</p>
      <h1>Учёт расходов</h1>
      <p class="subtitle">Записывайте траты и следите за итогом месяца.</p>
    </header>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Новая трата</h2>

      <form id="expense-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="amount">Сумма, ₸</label>
            <input id="amount" name="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="Например, 5 000" aria-describedby="amount-error" required>
            <p class="field-error" id="amount-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="category">Категория</label>
            <select id="category" name="category">
              <option value="Еда">Еда</option>
              <option value="Транспорт">Транспорт</option>
              <option value="Дом">Дом</option>
              <option value="Другое">Другое</option>
            </select>
          </div>

          <div class="field">
            <label for="date">Дата</label>
            <input id="date" name="date" type="date" aria-describedby="date-error" required>
            <p class="field-error" id="date-error" aria-live="polite"></p>
          </div>

          <div class="field field--wide">
            <label for="comment">Комментарий <span>(необязательно)</span></label>
            <input id="comment" name="comment" type="text" autocomplete="off" placeholder="Например, продукты">
          </div>
        </div>

        <button class="primary-button" type="submit">Добавить трату</button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="expenses" aria-labelledby="expenses-title">
      <div class="summary">
        <div>
          <p class="summary__label" id="month-label">Итог за месяц</p>
          <p class="summary__value" id="month-total">0 ₸</p>
        </div>
        <div class="summary__icon" aria-hidden="true">₸</div>
      </div>

      <div class="list-header">
        <h2 id="expenses-title">Траты</h2>
        <span id="expense-count">0 записей</span>
      </div>

      <p class="empty-state" id="empty-state">Пока трат нет. Добавьте первую.</p>
      <ul class="expense-list" id="expense-list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
